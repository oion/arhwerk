description: Clădirea în U, datată 1800, cu fațadă neoclasică modificată în sec. XIX
  și galerie adăugată în 1900, va fi restaurată prin decopertarea tencuielilor deteriorate,
  verificarea și înlocuirea planșeelor din lemn unde e necesar, refacerea pardoselii
  la subsol, redeschiderea aerisirilor, refacerea pavajului în gang și curte, restaurarea
  cornișelor, brâielor, ancadramentelor și galeriei din lemn, precum și revizuirea
  acoperișului.
