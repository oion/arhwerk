description: Proiectul a inclus restaurarea casei Comănici, monument istoric din 2019,
  și extinderea cu un nou corp pe locul fostei șuri. Clădirea, afectată de tasări,
  umiditate și zidărie defectuoasă, a fost consolidată prin refacerea tencuielilor,
  zidăriei, pardoselilor și șarpantei. Analizele au datat elementele de lemn în jurul
  anului 1830.
