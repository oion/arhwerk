description: Construcția trilobată, definitivată între 1780-1805 și completată ulterior
  cu contraforturi, este o realizare modestă ca dimensiuni și execuție, vizibilă după
  decopertările din 2013-2017. Exteriorul are o elevație simplă, cornișă de tencuială,
  acoperiș în două ape cu țiglă ceramică și turn clopotniță cu coif octogonal. Nișele
  superioare, cândva pictate, au fost repictate recent. Intervențiile propuse vizează
  corectarea deficiențelor și asigurarea funcționării corespunzătoare a bisericii.
